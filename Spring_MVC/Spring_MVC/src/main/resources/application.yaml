spring:
  application:
    name: Spring_MVC

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/springMVC?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: msl
    password: mysql123

  data:
    redis:
      host: localhost
      port: 6379
      password: 123
      database: 0
      timeout: 5000ms

mybatis-plus:
  # 配置Mapper文件的包路径
  mapper-locations: classpath*:mapper/**/*.xml
  # 配置实体类的包路径
  type-aliases-package: io.com.spring_mvc.entity
  configuration:
    # 开启驼峰命名
    map-underscore-to-camel-case: true
    # 开发环境控制台打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
